name: Release

# Version-matching v* tags publish through npm Trusted Publishing (OIDC).
# Numbered betas go to the beta dist-tag and GitHub prereleases; stable uses latest.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Validate release channel and tag
        id: channel
        run: |
          node --test scripts/release-channel.test.mjs
          node scripts/release-channel.mjs packages/dewee-webchat/package.json "$GITHUB_REF_NAME"
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      - name: Check whether npm version is already published
        id: version
        env:
          RELEASE_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          if npm view "dewee-webchat@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm -C packages/dewee-webchat typecheck
      - run: pnpm -C packages/dewee-webchat test
      - run: pnpm -C packages/dewee-webchat build

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        working-directory: packages/dewee-webchat
        env:
          NPM_DIST_TAG: ${{ steps.channel.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" php/dewee-webchat.php --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
